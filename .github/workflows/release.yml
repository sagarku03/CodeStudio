name: Build and Release CodeStudio APK

on:
  push:
    branches: [ main, master ]
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    name: Build APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Copy & Rename APK
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/debug/app-debug.apk release-apks/CodeStudio-v1.0.0.apk
          ls -lh release-apks/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, refs/tags/) || github.ref == refs/heads/main || github.ref == refs/heads/master
        with:
          tag_name: v1.0.0
          name: CodeStudio v1.0.0
          body: |
            ### CodeStudio v1.0.0 Release
            - Modern Android AI IDE & Workspace
            - Powered by Jetpack Compose, Sora Editor & Wire gRPC
            - Download `CodeStudio-v1.0.0.apk` below to install directly on your Android device.
          files: release-apks/CodeStudio-v1.0.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
